name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore DSR-Randomizer.sln
      - run: cmake --preset windows-x64-release
      - run: cmake --build --preset windows-x64-release
      - run: ctest --preset windows-x64-release --output-on-failure
      - run: dotnet build DSR-Randomizer.sln -c Release --no-restore
      - run: dotnet test DSR-Randomizer.sln -c Release --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: native-supervisor-test-artifacts
          path: |
            native/out/build/windows-x64-release/native/Release/DSRRandomizer.SuspendedFixture.exe
            native/out/build/windows-x64-release/native/runtime/Release/DSRRandomizer.Runtime.dll
          retention-days: 7
      - shell: pwsh
        run: ./packaging/build-release.ps1 -Version 0.1.0-alpha.2 -OutputPath artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: DSR-for-MOD-redistributable
          path: artifacts/DSR-for-MOD-*-redistributable.zip
